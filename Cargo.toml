[package]
name = "lsq"
version = "0.1.0"
edition = "2024"
description = "Agent-native semantic code queries for TypeScript and Rust — an MCP server over LSP"

[dependencies]
# (de)serialization for JSON-RPC bodies and structured output
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# unified diffs for rename / fix output
similar = "2"
# ergonomic error propagation
anyhow = "1"
# structured logging (to stderr; stdout stays a clean MCP transport)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lsp-types = "0.97.0"
url = "2.5.8"

# MCP stdio server (the only front-end) + the async runtime it needs
rmcp = { version = "1.8.0", features = ["server", "transport-io", "macros"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1"
walkdir = "2.5.0"
